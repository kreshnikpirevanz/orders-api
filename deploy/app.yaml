# Build + run on OpenShift. Every object carries backstage.io/kubernetes-id so
# the Kubernetes and Topology tabs pick it up. Apply with:
#   oc apply -n poc-apps -f deploy/
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: orders-api
  labels:
    backstage.io/kubernetes-id: orders-api
---
# Source-to-Image build: OpenShift pulls the repo and builds it with its Node.js builder image.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: orders-api
  labels:
    backstage.io/kubernetes-id: orders-api
spec:
  source:
    git:
      uri: https://github.com/kreshnikpirevanz/orders-api.git
      ref: main
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: nodejs:latest
  output:
    to:
      kind: ImageStreamTag
      name: orders-api:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    backstage.io/kubernetes-id: orders-api
    app.kubernetes.io/part-of: platform-poc
  annotations:
    # Roll out automatically when a new image is built
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"orders-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
        backstage.io/kubernetes-id: orders-api
    spec:
      containers:
        - name: app
          image: orders-api:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    backstage.io/kubernetes-id: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orders-api
  labels:
    backstage.io/kubernetes-id: orders-api
spec:
  to:
    kind: Service
    name: orders-api
  tls:
    termination: edge
