# Used by OpenShift Dev Spaces (Lesson 5) to build a ready-to-code workspace.
schemaVersion: 2.2.0
metadata:
  name: orders-api
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 2Gi
      mountSources: true
      endpoints:
        - name: http
          targetPort: 8080
commands:
  - id: run
    exec:
      component: tools
      label: Run the service
      commandLine: npm start
      workingDir: ${PROJECT_SOURCE}
